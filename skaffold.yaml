# Skaffold inner-loop (podman runner — ARCHITECTURE.md §6, PHASE-1 §8): build → kind load → helm upgrade.
# Usage:  skaffold dev --platform=podman
# One artifact per umbrella subchart — the build and deploy sets stay the same eight.
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: novaforge
build:
  tagPolicy:
    gitCommit: {}
  local:
    push: false
    useDockerCLI: false
  artifacts:
    - image: ghcr.io/novaforge/novaforge-gateway
      jib:
        project: services/gateway
    - image: ghcr.io/novaforge/novaforge-metadata-service
      jib:
        project: services/metadata-service
    - image: ghcr.io/novaforge/novaforge-data-runtime
      jib:
        project: services/data-runtime/api
    - image: ghcr.io/novaforge/novaforge-audit-service
      jib:
        project: services/audit-service
    - image: ghcr.io/novaforge/novaforge-script-engine
      jib:
        project: services/script-engine
    - image: ghcr.io/novaforge/novaforge-workflow-service
      jib:
        project: services/workflow-service
    - image: ghcr.io/novaforge/novaforge-scheduler-service
      jib:
        project: services/scheduler-service
    - image: ghcr.io/novaforge/novaforge-notification-service
      jib:
        project: services/notification-service
deploy:
  helm:
    releases:
      - name: novaforge
        chartPath: deploy/helm/novaforge
        artifactOverrides:
          novaforge-gateway:
            image:
              repository: ghcr.io/novaforge/novaforge-gateway
          novaforge-metadata-service:
            image:
              repository: ghcr.io/novaforge/novaforge-metadata-service
          novaforge-data-runtime:
            image:
              repository: ghcr.io/novaforge/novaforge-data-runtime
          novaforge-audit-service:
            image:
              repository: ghcr.io/novaforge/novaforge-audit-service
          novaforge-script-engine:
            image:
              repository: ghcr.io/novaforge/novaforge-script-engine
          novaforge-workflow-service:
            image:
              repository: ghcr.io/novaforge/novaforge-workflow-service
          novaforge-scheduler-service:
            image:
              repository: ghcr.io/novaforge/novaforge-scheduler-service
          novaforge-notification-service:
            image:
              repository: ghcr.io/novaforge/novaforge-notification-service
        imageStrategy:
          helm: {}
