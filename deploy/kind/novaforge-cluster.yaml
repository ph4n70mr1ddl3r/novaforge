# Kind-on-Podman cluster config (PHASE-1 §8, Q4's week-1 parallel track; also the
# Phase 2 preview path). Create with:
#
#   KIND_EXPERIMENTAL_PROVIDER=podman kind create cluster \
#     --config deploy/kind/novaforge-cluster.yaml
#
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: novaforge
nodes:
  - role: control-plane
    # Local dev stack ports (gateway 8080, Keycloak 8082):
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30082
        hostPort: 8082
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
