# NovaForge local infrastructure (PHASE-0 §7) — infra only; gateway + backing services
# run on the host. Rootless-compatible; run with:  podman compose -f novaforge.yaml up -d
name: novaforge

services:
  postgres:
    image: docker.io/library/postgres:16.15
    container_name: novaforge-postgres
    environment:
      POSTGRES_PASSWORD: novaforge
    ports:
      # Default host port is 5434: this host runs a native Postgres on 5432, and
      # the mda workspace reserves 5433 for its dev database — 5434 keeps every
      # stack on its own port. Override with NOVAFORGE_POSTGRES_PORT when needed
      # (the JVM connection strings ride the same variable).
      - "${NOVAFORGE_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres-init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: novaforge-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8082:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The Keycloak image ships no curl/wget — probe the HTTP port with bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /realms/novaforge HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7.4.11
    container_name: novaforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  kafka:
    image: docker.io/apache/kafka:4.3.1
    container_name: novaforge-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      # Host-run services use localhost:9092; in-network consumers (kafka-exporter)
      # use the INTERNAL listener — advertised names must match where each client lives.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:v3.14.0
    container_name: novaforge-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:12.3.11
    container_name: novaforge-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # --- PHASE-3 §9 expansion: the tracing/log backends + Kafka lag exporter ---

  tempo:
    image: docker.io/grafana/tempo:2.10.0
    container_name: novaforge-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      # Tempo API (Grafana reaches it in-network; the host port is for inspection).
      - "3200:3200"
      # OTLP ingest from the host-run services (direct-to, no collector — §13 Q4).
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro,Z
      - tempo-data:/var/tempo
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:3.6.1
    container_name: novaforge-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro,Z
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: docker.io/grafana/promtail:3.6.1
    container_name: novaforge-promtail
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro,Z
      - promtail-data:/var/lib/promtail
      # Host services write their file logs here (logging.file.name defaults to
      # /tmp/novaforge/logs). Rootless podman mounts the host dir read-only.
      - "${NOVAFORGE_LOG_DIR:-/tmp/novaforge/logs}:/var/log/novaforge:ro"
    depends_on:
      - loki
    restart: unless-stopped

  # Local email sink (PHASE-4 §2): the Notification Service's SMTP target.
  mailpit:
    image: docker.io/axllent/mailpit:v1.23
    container_name: novaforge-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    restart: unless-stopped

  # Object storage (PHASE-6 §2/§8): the File Service's MinIO — API 9000, console
  # 9001 — with a persistent volume. Buckets auto-create on first service start.
  minio:
    image: docker.io/minio/minio:RELEASE.2025-11-25T16-26-34Z
    container_name: novaforge-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: novaforge
      MINIO_ROOT_PASSWORD: novaforge-secret
    ports:
      - "9000:9000"   # S3 API (presigned upload/download)
      - "9001:9001"   # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  kafka-exporter:
    image: docker.io/danielqsj/kafka-exporter:v1.9.0
    container_name: novaforge-kafka-exporter
    command: ["--kafka.server=kafka:29092"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  keycloak-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
  promtail-data:
