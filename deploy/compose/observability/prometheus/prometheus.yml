# Prometheus scrape config (PHASE-0 §7/T8). Services run on the host, so the container
# reaches them through host.docker.internal (extra_hosts: host-gateway in compose).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: novaforge-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: novaforge-metadata-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: novaforge-data-runtime
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]

  - job_name: novaforge-audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8085"]

  - job_name: novaforge-script-engine
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]

  - job_name: novaforge-workflow-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8086"]

  - job_name: novaforge-notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8088"]

  - job_name: novaforge-reporting-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8089"]

  - job_name: novaforge-scheduler-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8087"]

  # Kafka consumer lag (PHASE-3 §9): the spine's health as seen from the groups.
  - job_name: novaforge-kafka-lag
    static_configs:
      - targets: ["kafka-exporter:9308"]
