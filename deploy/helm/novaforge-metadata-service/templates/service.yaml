apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-novaforge-metadata-service
  labels: {{ include "novaforge-metadata-service.labels" . | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector: {{ include "novaforge-metadata-service.selectorLabels" . | indent 4 }}
