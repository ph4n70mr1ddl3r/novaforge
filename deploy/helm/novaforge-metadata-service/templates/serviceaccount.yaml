{{- if .Values.serviceAccount.create }}
# Cluster isolation (twenty-second pass): the chart's pods run on their own
# ServiceAccount — never the namespace default every workload shares — and the
# token is not automounted. Nothing in this service touches the Kubernetes API
# (siblings and infra are plain pod networking), so the automounted token has
# no consumer except an attacker: a sandbox escape reads the mounted
# credential and trades it for API access. The deployment repeats the kill at
# the pod level — automountServiceAccountToken: false there wins even if this
# object ever drifts back to automounting.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-novaforge-metadata-service
  labels:
  {{- include "novaforge-metadata-service.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
