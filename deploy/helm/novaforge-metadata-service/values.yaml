image:
  repository: ghcr.io/novaforge/novaforge-metadata-service
  tag: "0.1.0-SNAPSHOT"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8081

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi

# Staged environments fail closed on the committed development secrets
# (2025-08-27 review): the service-client default never authenticates here, and
# the integration secrets store refuses the public dev data key. Create the
# referenced Kubernetes Secrets before deploying:
#   kubectl create secret generic novaforge-service-client --from-literal=secret=<real-secret>
#   kubectl create secret generic novaforge-secrets --from-literal=data-key=<base64-32B-key>
env:
  - name: NOVAFORGE_AUTH_ALLOW_DEFAULT_SECRET
    value: "false"
  - name: NOVAFORGE_SERVICE_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: novaforge-service-client
        key: secret

  # - name: NOVAFORGE_POSTGRES_HOST
  #   value: novaforge-postgres
