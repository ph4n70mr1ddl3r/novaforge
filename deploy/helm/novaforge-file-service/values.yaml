# Image tags (twenty-third pass): 0.1.0-SNAPSHOT is the LOCAL DEV default —
# skaffold overrides it per-build with its gitCommit tag, and CI's images job
# publishes immutable <commit-sha> tags to GHCR on every push to main
# (`helm upgrade --set image.tag=<sha>`); IfNotPresent is correct for both —
# the immutability lives in the tag, not the pull policy.
image:
  repository: ghcr.io/novaforge/novaforge-file-service
  tag: "0.1.0-SNAPSHOT"
  pullPolicy: IfNotPresent

replicaCount: 1

# L-TP7 posture (2025-08-27 review, fourth pass): the actuator's prometheus
# endpoint is permitAll — scraping has no credential channel today — so the
# posture is that these service ports NEVER leave the cluster. Keep
# service.type ClusterIP; no NodePort/LoadBalancer on service ports.
service:
  type: ClusterIP
  port: 8091

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi

# Staged environments fail closed on the committed development secrets
# (2025-08-27 review): the service-client default never authenticates here, and
# the integration secrets store refuses the public dev data key. Create the
# referenced Kubernetes Secrets before deploying:
#   kubectl create secret generic novaforge-service-client --from-literal=secret=<real-secret>
#   kubectl create secret generic novaforge-secrets --from-literal=data-key=<base64-32B-key>
# Infra wiring (2026-08-31, the ninth pass's recorded-open close): the chart used to
# carry only the auth pair, so a deployed service booted against localhost defaults —
# MinIO, Postgres, and ClamAV all unreachable, and every upload recorded
# virusScan: skipped (the AV control silently absent outside CI). Endpoints point at
# the in-cluster service names; credentials ride the fail-closed secret posture
# (create the referenced Secrets before deploying, mirroring the auth pair):
#   kubectl create secret generic novaforge-db --from-literal=user=<real> \
#                                               --from-literal=password=<real>
#   kubectl create secret generic novaforge-minio --from-literal=access-key=<real> \
#                                                   --from-literal=secret-key=<real>
# Scanning is ON in deployed profiles (fail-closed: with clamav.enabled=true a
# reachable clamd is required — an unreachable scanner fails uploads, it never
# silently waves them through). Point NOVAFORGE_CLAMAV_HOST at a clamd deployment;
# locally the compose stack has no clamav service (the novaforge-infra chart
# carries one for the kind cluster), which is why the default is off.
# Infra wiring (nineteenth pass, closing the H-10P1 class for every chart): the
# chart used to carry only the auth pair (or nothing), so a deployed service
# booted against the yaml defaults — every endpoint localhost, i.e. the pod
# itself: Flyway failed to CrashLoopBackOff on the DB services and the gateway
# 502'd on every route. Endpoints point at the in-cluster service names; DB
# credentials ride the fail-closed secret posture like the auth pair (create the
# referenced Secrets before deploying):
#   kubectl create secret generic novaforge-db --from-literal=user=<real> \
#                                               --from-literal=password=<real>
# The issuer, Kafka, Tempo, and sibling names assume the novaforge-infra chart's
# services (deploy/helm/novaforge-infra — the compose stack's in-cluster twin);
# override per environment in values overlays.
auth:
  # fail-closed BY DEFAULT (staged environments reject the committed dev
  # secret); the kind dev cluster sets --set auth.allowDefaultSecret=true — the
  # compose stack's own local bring-up posture. Consumed by the deployment
  # template: values env lists are pure data, no templating here.
  allowDefaultSecret: false
env:
  - name: NOVAFORGE_SERVICE_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: novaforge-service-client
        key: secret
  - name: NOVAFORGE_POSTGRES_HOST
    value: "novaforge-postgres"
  - name: NOVAFORGE_POSTGRES_PORT
    value: "5432"
  - name: NOVAFORGE_FILE_DB_USER
    valueFrom:
      secretKeyRef:
        name: novaforge-db
        key: user
  - name: NOVAFORGE_FILE_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: novaforge-db
        key: password
  - name: NOVAFORGE_MINIO_ENDPOINT
    value: "http://novaforge-minio:9000"
  - name: NOVAFORGE_MINIO_USER
    valueFrom:
      secretKeyRef:
        name: novaforge-minio
        key: access-key
  - name: NOVAFORGE_MINIO_PASSWORD
    valueFrom:
      secretKeyRef:
        name: novaforge-minio
        key: secret-key
  - name: NOVAFORGE_CLAMAV_ENABLED
    value: "true"
  - name: NOVAFORGE_CLAMAV_HOST
    value: "novaforge-clamav"
  - name: NOVAFORGE_CLAMAV_PORT
    value: "3310"
  - name: NOVAFORGE_KAFKA
    value: "novaforge-kafka:9092"
  - name: NOVAFORGE_AUTH_ISSUER
    value: "http://novaforge-keycloak:8080/realms/novaforge"
  - name: NOVAFORGE_TEMPO_ENDPOINT
    value: "http://novaforge-tempo:4318/v1/traces"

# Cluster isolation (twenty-second pass): the chart's pods run on a dedicated
# ServiceAccount with the API token automount disabled — nothing in this
# service touches the Kubernetes API (siblings and infra are plain pod
# networking), so the automounted token has no consumer except an attacker: a
# sandbox escape reads the mounted credential and trades it for API access.
# create=false only if you pre-provision a ServiceAccount with the name the
# deployment references.
serviceAccount:
  create: true

# Cluster isolation (twenty-second pass): default-deny in BOTH directions —
# each flow the service needs is an explicit allow in
# templates/networkpolicy.yaml, and that allow list is exactly the env wiring
# above (each allow carries its why). Disable only on clusters whose CNI
# enforces no network policy — an unenforced policy is silent false security.
networkPolicy:
  enabled: true

# Disruption posture (twenty-third pass): the eviction budget
# (templates/poddisruptionbudget.yaml) node drains consult before taking this
# service's pod — registering it makes drain behavior visible and deliberate
# instead of best-effort. The maxUnavailable-vs-minAvailable rationale lives
# with the template; flip the field there when replicas scale.
podDisruptionBudget:
  enabled: true

# Autoscaling (twenty-third pass): OFF by default, on purpose: v1 ships one
# replica per service and the kind dev cluster runs no metrics-server by
# default, so an enabled HPA has no metrics to act on — utilization reads
# <unknown>, nothing ever scales, and the Deployment drops its replicas field
# for an autoscaler that cannot decide: pods unschedulable-at-scale for
# nothing, exactly when scaling was the point. Flip this only on clusters
# that actually run a metrics-server; the bounds below are dev-sized.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
