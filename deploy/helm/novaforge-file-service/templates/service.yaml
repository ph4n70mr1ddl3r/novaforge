apiVersion: v1
kind: Service
metadata:
  name: novaforge-file-service   # flat: env wiring references these DNS names verbatim (values are data — no release templating)
  labels:
  {{- include "novaforge-file-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
  {{- include "novaforge-file-service.selectorLabels" . | nindent 4 }}
