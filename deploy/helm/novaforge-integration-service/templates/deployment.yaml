apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-novaforge-integration-service
  labels:
  {{- include "novaforge-integration-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- else }}
  # the HPA owns the count now — a hard-coded replicas field fights the autoscaler
  {{- end }}
  selector:
    matchLabels:
    {{- include "novaforge-integration-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "novaforge-integration-service.selectorLabels" . | nindent 8 }}
    spec:
      # k8s EnableServiceLinks auto-injects <FLATNAME>_PORT=tcp://10.96.x.x:PORT for every
      # Service whose name collides with an env placeholder — NOVAFORGE_REDIS_PORT and
      # NOVAFORGE_POSTGRES_PORT both resolved to tcp:// URLs in-cluster (found live: the
      # gateway died binding spring.data.redis.port to int, scheduler/workflow died on a
      # mangled JDBC URL, while identical boots outside a cluster were clean). DNS owns
      # name resolution here; the injected links are pure collision surface.
      enableServiceLinks: false
      # Cluster isolation (twenty-second pass): run on the chart's own
      # token-less ServiceAccount, never the namespace default — and repeat
      # automountServiceAccountToken: false at the pod level because the
      # pod-level field wins even if someone later flips the ServiceAccount
      # itself back to automounting. Belt and braces.
      serviceAccountName: {{ .Release.Name }}-novaforge-integration-service
      automountServiceAccountToken: false
      containers:
        - name: novaforge-integration-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8090
              name: http
          env:
            # fail-closed by default; the dev cluster overrides via values
            # (values env lists are pure data — the templating lives here)
            - name: NOVAFORGE_AUTH_ALLOW_DEFAULT_SECRET
              value: {{ .Values.auth.allowDefaultSecret | default false | quote }}
          {{- toYaml .Values.env | nindent 12 }}
          # Startup grace (nineteenth pass): a Boot fat jar — Flyway, the JWKS fetch,
          # Kafka listeners — sharing a kind node with ten sibling JVMs can exceed
          # the liveness budget's first ~30s; without this probe the kubelet kills
          # the container mid-boot (the classic kill-before-ready CrashLoop).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          resources:
          {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
