{{- if .Values.networkPolicy.enabled }}
# Cluster isolation (twenty-second pass): selecting these pods for BOTH
# policyTypes makes them default-deny — a flow exists only where a rule below
# names it, so the rest of the cluster (and the internet) stays unreachable
# and a compromised pod cannot scout its next hop. The allow list is the env
# wiring the chart already carries: every peer below is a host its values
# name, so enforcing this breaks nothing the service actually dials.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-novaforge-integration-service
  labels:
  {{- include "novaforge-integration-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
    {{- include "novaforge-integration-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # anyone in this release (the instance label covers every chart deployed
    # beside it) may call this service on its port
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8090
  egress:
    # DNS: every host below resolves through kube-dns (kube-system) — UDP 53
    # for the common path, TCP 53 for truncated-answer fallback
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # keycloak: NOVAFORGE_AUTH_ISSUER — the JWKS fetch at boot; the resource
    # server serves nothing until it can validate tokens against the issuer
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: novaforge-infra
              component: keycloak
      ports:
        - protocol: TCP
          port: 8080
    # tempo: NOVAFORGE_TEMPO_ENDPOINT — OTLP trace export
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: novaforge-infra
              component: tempo
      ports:
        - protocol: TCP
          port: 4318
    # postgres: NOVAFORGE_POSTGRES_HOST — Flyway migrations and the
    # integration store's JDBC pool
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: novaforge-infra
              component: postgres
      ports:
        - protocol: TCP
          port: 5432
    # kafka: NOVAFORGE_KAFKA — connector events
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: novaforge-infra
              component: kafka
      ports:
        - protocol: TCP
          port: 9092
    # metadata-service: NOVAFORGE_METADATA_URL — connection metadata
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: novaforge-metadata-service
      ports:
        - protocol: TCP
          port: 8081
    # data-runtime: NOVAFORGE_DATA_RUNTIME_URL — sync job execution
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: novaforge-data-runtime
      ports:
        - protocol: TCP
          port: 8083
    # file-service: NOVAFORGE_FILE_URL — import/export attachments
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: novaforge-file-service
      ports:
        - protocol: TCP
          port: 8091
    # reporting-service: NOVAFORGE_REPORTING_URL — sync run reports
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: novaforge-reporting-service
      ports:
        - protocol: TCP
          port: 8089
    # notification-service: NOVAFORGE_NOTIFICATION_URL — sync outcomes
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: novaforge-notification-service
      ports:
        - protocol: TCP
          port: 8088
{{- end }}
