image:
  repository: ghcr.io/novaforge/novaforge-script-engine
  tag: "0.1.0-SNAPSHOT"
  pullPolicy: IfNotPresent

replicaCount: 1

# L-TP7 posture (2025-08-27 review, fourth pass): the actuator's prometheus
# endpoint is permitAll — scraping has no credential channel today — so the
# posture is that these service ports NEVER leave the cluster. Keep
# service.type ClusterIP; no NodePort/LoadBalancer on service ports.
service:
  type: ClusterIP
  port: 8084

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi

env:
  # Containment (2026-08-31, seventeenth pass): the sandbox's heap cap is a sampled,
  # process-wide tripwire — a single-statement allocation bomb completes before any
  # sample, and 8 concurrent lanes can out-allocate the shared heap. Pinning -Xmx
  # bounds the blast radius to exactly this pod (an OOM kill restarts the script
  # engine alone; every other tenant-facing service keeps serving), which is the
  # community-edition containment ADR-003 #4 anticipates process pools for.
  - name: JAVA_TOOL_OPTIONS
    value: "-Xmx512m -XX:+ExitOnOutOfMemoryError"
  - name: NOVAFORGE_SCRIPT_MAX_CONCURRENT
    value: "4"
