# ClamAV (the §8 virus-scan gate's clamd): the file chart points
# NOVAFORGE_CLAMAV_HOST at this name with scanning ON (fail-closed — an
# unreachable clamd fails uploads, it never waves them through), so the dev
# cluster needs it running. Signatures live on a PVC: freshclam's ~300 MB
# database must not re-download on every pod restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novaforge-clamav
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
    component: clamav
spec:
  replicas: 1
  selector:
    matchLabels:
    {{- include "novaforge-infra.selector" (dict "root" . "component" "clamav") | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "novaforge-infra.selector" (dict "root" . "component" "clamav") | nindent 8 }}
    spec:
      enableServiceLinks: false
      # Cluster isolation (twenty-second pass): run on the component's own
      # token-less ServiceAccount, never the namespace default — and repeat
      # automountServiceAccountToken: false at the pod level because the
      # pod-level field wins even if someone later flips the ServiceAccount
      # itself back to automounting. Belt and braces.
      serviceAccountName: {{ .Release.Name }}-novaforge-infra-clamav
      automountServiceAccountToken: false
      # The image's entrypoint chowns its data dir at boot — legal only for
      # root, and the pod runs as uid 100 (found live: CrashLoop on
      # "chown: /var/lib/clamav: Operation not permitted"). A root init
      # container pre-owns the volume for the clamav user; the main container
      # keeps the non-root posture (the entrypoint's own chown then no-ops as
      # a same-owner rename).
      initContainers:
        - name: chown-signatures
          image: {{ .Values.clamav.image }}
          command: ["chown", "-R", "100:101", "/var/lib/clamav"]
          volumeMounts:
            - name: signatures
              mountPath: /var/lib/clamav
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
      containers:
        - name: clamav
          image: {{ .Values.clamav.image }}
          ports:
            - containerPort: 3310
              name: clamd
          startupProbe:
            # first boot downloads the signature database — many minutes on a cold link
            tcpSocket:
              port: clamd
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: clamd
          livenessProbe:
            tcpSocket:
              port: clamd
          volumeMounts:
            - name: signatures
              mountPath: /var/lib/clamav
            # the image's entrypoint creates /run/clamav at boot — root-owned
            # path, unwritable at uid 100 (found live: CrashLoop on Permission
            # denied). An emptyDir gives the non-root user its own.
            - name: run
              mountPath: /run/clamav
            # the entrypoint also ln -s's its lockfile under /var/lock (found
            # live: "ln: /var/lock/lock: Permission denied" as uid 100)
            - name: lock
              mountPath: /var/lock
            - name: tmp
              mountPath: /tmp
          resources:
            # signature scans are memory-hungry; the 1Gi default limit is the dev floor
          {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
          {{- include "novaforge-infra.securityContext" (dict "uid" 100 "fsGroup" 101) | nindent 12 }}
      volumes:
        - name: signatures
          persistentVolumeClaim:
            claimName: novaforge-clamav-signatures
        - name: run
          emptyDir: {}
        - name: lock
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: novaforge-clamav-signatures
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: novaforge-clamav   # flat: the file chart's NOVAFORGE_CLAMAV_HOST names it verbatim
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3310
      targetPort: clamd
      name: clamd
  selector:
  {{- include "novaforge-infra.selector" (dict "root" . "component" "clamav") | nindent 4 }}
