{{- if .Values.secrets.create }}
# The dev-instance secret set the eleven charts reference — the compose stack's
# own committed values (Chart.yaml's posture note): fine for the kind dev
# cluster, NEVER for staged environments (set secrets.create=false and bring
# your own; the services' fail-closed legs reject these values there anyway).
apiVersion: v1
kind: Secret
metadata:
  name: novaforge-db
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
stringData:
  user: {{ .Values.secrets.db.user | quote }}
  password: {{ .Values.secrets.db.password | quote }}
  owner-user: {{ .Values.secrets.db.ownerUser | quote }}
  owner-password: {{ .Values.secrets.db.ownerPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: novaforge-service-client
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
stringData:
  secret: {{ .Values.secrets.serviceClientSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: novaforge-secrets
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
stringData:
  data-key: {{ .Values.secrets.secretsDataKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: novaforge-minio
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
stringData:
  access-key: {{ .Values.secrets.minio.accessKey | quote }}
  secret-key: {{ .Values.secrets.minio.secretKey | quote }}
{{- end }}
