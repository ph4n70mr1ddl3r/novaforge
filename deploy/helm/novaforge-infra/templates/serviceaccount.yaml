{{- if .Values.serviceAccount.create }}
# Cluster isolation (twenty-second pass): one ServiceAccount per component —
# postgres, kafka, redis, keycloak, tempo, minio, the minio-init Job, clamav —
# never the namespace default every workload shares, and none automounts the
# API token. These images touch pod networking only (the mc Job's one call is
# to the minio Service), so an automounted token has no consumer except an
# attacker: a container escape reads the mounted credential and trades it for
# Kubernetes API access. Every workload template repeats the kill at the pod
# level — automountServiceAccountToken: false there wins even if this object
# ever drifts back to automounting.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-novaforge-infra-postgres
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
    component: postgres
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-novaforge-infra-kafka
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
    component: kafka
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-novaforge-infra-redis
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
    component: redis
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-novaforge-infra-keycloak
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
    component: keycloak
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-novaforge-infra-tempo
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
    component: tempo
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-novaforge-infra-minio
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
    component: minio
automountServiceAccountToken: false
---
# the bucket-init Job's pod runs here too — a one-shot `mc` has even less
# business holding an API credential than the daemons do
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-novaforge-infra-minio-init
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
    component: minio-init
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-novaforge-infra-clamav
  labels:
  {{- include "novaforge-infra.labels" . | nindent 4 }}
    component: clamav
automountServiceAccountToken: false
{{- end }}
