# Tempo — the trace backend (PHASE-3 §9): every service's OTLP exporter ships spans
# direct-to here (no collector — §13 Q4, resolved). Single-binary local deployment;
# traces land in local storage under the tempo-data volume.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 48h
