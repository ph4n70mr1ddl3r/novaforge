apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-novaforge-scheduler-service
  labels:
  {{- include "novaforge-scheduler-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- else }}
  # the HPA owns the count now — a hard-coded replicas field fights the autoscaler
  {{- end }}
  selector:
    matchLabels:
    {{- include "novaforge-scheduler-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "novaforge-scheduler-service.selectorLabels" . | nindent 8 }}
    spec:
      # Cluster isolation (twenty-second pass): run on the chart's own
      # token-less ServiceAccount, never the namespace default — and repeat
      # automountServiceAccountToken: false at the pod level because the
      # pod-level field wins even if someone later flips the ServiceAccount
      # itself back to automounting. Belt and braces.
      serviceAccountName: {{ .Release.Name }}-novaforge-scheduler-service
      automountServiceAccountToken: false
      containers:
        - name: novaforge-scheduler-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8087
              name: http
          env:
          {{- toYaml .Values.env | nindent 12 }}
          # Startup grace (nineteenth pass): a Boot fat jar — Flyway, the JWKS fetch,
          # Kafka listeners — sharing a kind node with ten sibling JVMs can exceed
          # the liveness budget's first ~30s; without this probe the kubelet kills
          # the container mid-boot (the classic kill-before-ready CrashLoop).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          resources:
          {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
