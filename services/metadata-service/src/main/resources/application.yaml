spring:
  task:
    scheduling:
      # Eighteenth pass: Boot's default scheduler is ONE thread — a long leg
      # (a wedged remote read, a multi-minute import) starved every other
      # @Scheduled duty of this service (outbox relays, scanners, reapers).
      pool:
        size: 2
  application:
    name: novaforge-metadata-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${novaforge.auth.issuer-uri:http://localhost:8082/realms/novaforge}
  datasource:
    url: jdbc:postgresql://${NOVAFORGE_POSTGRES_HOST:localhost}:${NOVAFORGE_POSTGRES_PORT:5432}/novaforge_metadata
    username: ${NOVAFORGE_METADATA_DB_USER:novaforge}
    password: ${NOVAFORGE_METADATA_DB_PASSWORD:novaforge}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${NOVAFORGE_KAFKA:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    tracing:
      # Tempo direct-to (PHASE-3 §9, §13 Q4 — no collector in between).
      sampler: ${NOVAFORGE_TRACE_SAMPLER:always_on}
      export:
        otlp:
          endpoint: ${NOVAFORGE_TEMPO_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  file:
    # Promtail tails this shared dir into Loki (PHASE-3 §9).
    name: ${NOVAFORGE_LOG_DIR:/tmp/novaforge/logs}/${spring.application.name}.log
  pattern:
    # W3C trace context in every line — the shared-trace-id acceptance check (PHASE-0 §8)
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

novaforge:
  auth:
    # The harness's synthetic-actor grants ride the public client; the service client
    # provisions the scratch tenant (ADR-010, PHASE-3 §7).
    issuer-uri: ${NOVAFORGE_AUTH_ISSUER:http://localhost:8082/realms/novaforge}
    service-client:
      id: ${NOVAFORGE_SERVICE_CLIENT_ID:novaforge-runtime}
      secret: ${NOVAFORGE_SERVICE_CLIENT_SECRET:novaforge-runtime-secret}
      # Fail-closed switch for staged environments (the helm charts set it false):
      # the committed dev secret never authenticates outside local bring-up.
      allow-default-secret: ${NOVAFORGE_AUTH_ALLOW_DEFAULT_SECRET:true}
  data-runtime:
    # Suite steps replay through the generic runtime APIs as the actors (ADR-010 #3).
    url: ${NOVAFORGE_DATA_RUNTIME_URL:http://localhost:8083}
  workflow:
    # The harness's resolveTask/queryRecord(Task) ride the inbox API (PHASE-4 §12).
    url: ${NOVAFORGE_WORKFLOW_URL:http://localhost:8086}
  reporting:
    # The harness's runReport op rides the public run surface as the step's actor
    # (PHASE-5 §9) — report: execute and sharing row filters apply per run (§8).
    url: ${NOVAFORGE_REPORTING_URL:http://localhost:8089}
  metadata:
    # The candidate publish into the scratch tenant (self-call, same spelling every
    # other metadata caller uses).
    url: ${NOVAFORGE_METADATA_URL:http://localhost:8081}
    # kafka (default) emits metadata.published on the spine topic novaforge.metadata
    # (PHASE-3 §4 — the Phase 1 Redis pub/sub channel is retired); noop disables
    # emission for hermetic tests.
    publish-transport: ${NOVAFORGE_METADATA_PUBLISH_TRANSPORT:kafka}
