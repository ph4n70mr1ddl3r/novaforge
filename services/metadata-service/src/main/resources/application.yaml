spring:
  application:
    name: novaforge-metadata-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${novaforge.auth.issuer-uri:http://localhost:8082/realms/novaforge}
  datasource:
    url: jdbc:postgresql://${NOVAFORGE_POSTGRES_HOST:localhost}:${NOVAFORGE_POSTGRES_PORT:5432}/novaforge_metadata
    username: novaforge
    password: novaforge
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${NOVAFORGE_REDIS_HOST:localhost}
      port: ${NOVAFORGE_REDIS_PORT:6379}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    tracing:
      # Tempo direct-to (PHASE-3 §9, §13 Q4 — no collector in between).
      sampler: ${NOVAFORGE_TRACE_SAMPLER:always_on}
      export:
        otlp:
          endpoint: ${NOVAFORGE_TEMPO_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  file:
    # Promtail tails this shared dir into Loki (PHASE-3 §9).
    name: ${NOVAFORGE_LOG_DIR:/tmp/novaforge/logs}/${spring.application.name}.log
  pattern:
    # W3C trace context in every line — the shared-trace-id acceptance check (PHASE-0 §8)
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

novaforge:
  auth:
    # The harness's synthetic-actor grants ride the public client; the service client
    # provisions the scratch tenant (ADR-010, PHASE-3 §7).
    issuer-uri: ${NOVAFORGE_AUTH_ISSUER:http://localhost:8082/realms/novaforge}
    service-client:
      id: ${NOVAFORGE_SERVICE_CLIENT_ID:novaforge-runtime}
      secret: ${NOVAFORGE_SERVICE_CLIENT_SECRET:novaforge-runtime-secret}
  data-runtime:
    # Suite steps replay through the generic runtime APIs as the actors (ADR-010 #3).
    url: ${NOVAFORGE_DATA_RUNTIME_URL:http://localhost:8083}
  workflow:
    # The harness's resolveTask/queryRecord(Task) ride the inbox API (PHASE-4 §12).
    url: ${NOVAFORGE_WORKFLOW_URL:http://localhost:8086}
  metadata:
    # The candidate publish into the scratch tenant (self-call, same spelling every
    # other metadata caller uses).
    url: ${NOVAFORGE_METADATA_URL:http://localhost:8081}
    # redis (default) emits metadata.published on channel novaforge.metadata.events;
    # noop disables emission for hermetic tests (PHASE-1 §4 transport note).
    publish-transport: ${NOVAFORGE_METADATA_PUBLISH_TRANSPORT:redis}
