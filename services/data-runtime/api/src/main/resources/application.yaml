spring:
  application:
    name: novaforge-data-runtime
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${novaforge.auth.issuer-uri:http://localhost:8082/realms/novaforge}
  datasource:
    url: jdbc:postgresql://${NOVAFORGE_POSTGRES_HOST:localhost}:${NOVAFORGE_POSTGRES_PORT:5432}/novaforge_data
    username: novaforge
    password: novaforge
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${NOVAFORGE_REDIS_HOST:localhost}
      port: ${NOVAFORGE_REDIS_PORT:6379}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

novaforge:
  metadata-service:
    url: ${NOVAFORGE_METADATA_URL:http://localhost:8081}
  metadata:
    cache-index-ttl-ms: ${NOVAFORGE_METADATA_INDEX_TTL_MS:30000}
  sequences:
    block-size: ${NOVAFORGE_SEQUENCE_BLOCK:100}
