spring:
  task:
    scheduling:
      # Eighteenth pass: Boot's default scheduler is ONE thread — a long leg
      # (a wedged remote read, a multi-minute import) starved every other
      # @Scheduled duty of this service (outbox relays, scanners, reapers).
      pool:
        size: 4
  application:
    name: novaforge-data-runtime
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${novaforge.auth.issuer-uri:http://localhost:8082/realms/novaforge}
  datasource:
    url: jdbc:postgresql://${NOVAFORGE_POSTGRES_HOST:localhost}:${NOVAFORGE_POSTGRES_PORT:5432}/novaforge_data
    username: ${NOVAFORGE_DATA_DB_USER:novaforge}
    password: ${NOVAFORGE_DATA_DB_PASSWORD:novaforge}
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${NOVAFORGE_REDIS_HOST:localhost}
      port: ${NOVAFORGE_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${NOVAFORGE_KAFKA:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: novaforge-hook-retry
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    tracing:
      # Tempo direct-to (PHASE-3 §9, §13 Q4 — no collector in between).
      sampler: ${NOVAFORGE_TRACE_SAMPLER:always_on}
      export:
        otlp:
          endpoint: ${NOVAFORGE_TEMPO_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  file:
    # Promtail tails this shared dir into Loki (PHASE-3 §9).
    name: ${NOVAFORGE_LOG_DIR:/tmp/novaforge/logs}/${spring.application.name}.log
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

novaforge:
  events:
    relay-interval-ms: ${NOVAFORGE_RELAY_INTERVAL_MS:500}
    relay-batch: 100
  hooks:
    retry:
      # After-hook retry leg (PHASE-3 §2): bounded attempts, exponential backoff.
      max-attempts: ${NOVAFORGE_HOOK_RETRY_MAX:8}
      backoff-base-ms: ${NOVAFORGE_HOOK_RETRY_BACKOFF_MS:5000}
      scan-interval-ms: ${NOVAFORGE_HOOK_RETRY_SCAN_MS:2000}
  auth:
    # The provisioner's Keycloak orchestration + the service-client grants the
    # out-of-band callers (approvals, metadata index) authenticate with.
    issuer-uri: ${NOVAFORGE_AUTH_ISSUER:http://localhost:8082/realms/novaforge}
    service-client:
      id: ${NOVAFORGE_SERVICE_CLIENT_ID:novaforge-runtime}
      secret: ${NOVAFORGE_SERVICE_CLIENT_SECRET:novaforge-runtime-secret}
      # Fail-closed switch for staged environments (the helm charts set it false):
      # the committed dev secret never authenticates outside local bring-up.
      allow-default-secret: ${NOVAFORGE_AUTH_ALLOW_DEFAULT_SECRET:true}
  metadata:
    # Same spelling every other metadata caller uses (workflow/scheduler/notification).
    url: ${NOVAFORGE_METADATA_URL:http://localhost:8081}
    cache-index-ttl-ms: ${NOVAFORGE_METADATA_INDEX_TTL_MS:30000}
  workflow:
    # requestApproval hands suspensions here (PHASE-4 §4) — same spelling the
    # metadata-service harness uses.
    url: ${NOVAFORGE_WORKFLOW_URL:http://localhost:8086}
  script-engine:
    # Script hooks (ADR-003 escape hatch) call here with the caller's token relayed.
    url: ${NOVAFORGE_SCRIPT_ENGINE_URL:http://localhost:8084}
  sequences:
    block-size: ${NOVAFORGE_SEQUENCE_BLOCK:100}
