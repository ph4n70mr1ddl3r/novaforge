spring:
  task:
    scheduling:
      # Eighteenth pass: Boot's default scheduler is ONE thread — a long leg
      # (a wedged remote read, a multi-minute import) starved every other
      # @Scheduled duty of this service (outbox relays, scanners, reapers).
      pool:
        size: 4
  application:
    name: novaforge-workflow-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${novaforge.auth.issuer-uri:http://localhost:8082/realms/novaforge}
  datasource:
    url: jdbc:postgresql://${NOVAFORGE_POSTGRES_HOST:localhost}:${NOVAFORGE_POSTGRES_PORT:5432}/novaforge_workflow
    username: ${NOVAFORGE_WORKFLOW_DB_USER:novaforge}
    password: ${NOVAFORGE_WORKFLOW_DB_PASSWORD:novaforge}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${NOVAFORGE_KAFKA:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: novaforge-workflow
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8086

flowable:
  # ADR-004: the engine's schema lives in this service's own database — the shared
  # DataSource above — and manages its own ACT_* DDL (Flyway owns only wf_* tables).
  database-schema-update: true
  # In-process BPMN timers (PHASE-4 §9, ARCHITECTURE §2.8) — never the Scheduler.
  async-executor-activate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    tracing:
      # Tempo direct-to (PHASE-3 §9, §13 Q4 — no collector in between).
      sampler: ${NOVAFORGE_TRACE_SAMPLER:always_on}
      export:
        otlp:
          endpoint: ${NOVAFORGE_TEMPO_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  file:
    # Promtail tails this shared dir into Loki (PHASE-3 §9).
    name: ${NOVAFORGE_LOG_DIR:/tmp/novaforge/logs}/${spring.application.name}.log
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

novaforge:
  auth:
    issuer-uri: ${NOVAFORGE_AUTH_ISSUER:http://localhost:8082/realms/novaforge}
    service-client:
      id: ${NOVAFORGE_SERVICE_CLIENT_ID:novaforge-runtime}
      secret: ${NOVAFORGE_SERVICE_CLIENT_SECRET:novaforge-runtime-secret}
      # Fail-closed switch for staged environments (the helm charts set it false):
      # the committed dev secret never authenticates outside local bring-up.
      allow-default-secret: ${NOVAFORGE_AUTH_ALLOW_DEFAULT_SECRET:true}
  data-runtime:
    # Role resolution for the inbox ("my tasks" = mine or my roles) rides the
    # runtime's admin read surface — the platform DB is the runtime's to own.
    url: ${NOVAFORGE_DATA_RUNTIME_URL:http://localhost:8083}
  events:
    relay-interval-ms: ${NOVAFORGE_RELAY_INTERVAL_MS:500}
    relay-batch: 100
  sla:
    # §6 timers stay in-process with the Workflow Service (ARCHITECTURE §2.8) — a
    # scanner pass, not the Scheduler.
    scan-interval-ms: ${NOVAFORGE_SLA_SCAN_MS:5000}
  metadata:
    url: ${NOVAFORGE_METADATA_URL:http://localhost:8081}
  process:
    # §9 deploy sync — publish-driven like every registry (§7's split).
    sync-interval-ms: ${NOVAFORGE_PROCESS_SYNC_MS:30000}
