spring:
  application:
    name: novaforge-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: metadata-service
              uri: ${novaforge.upstreams.metadata-service:http://localhost:8081}
              predicates:
                - Path=/api/v1/metadata/**
            - id: data-runtime
              uri: ${novaforge.upstreams.data-runtime:http://localhost:8083}
              predicates:
                - Path=/api/v1/runtime/**,/api/v1/admin/**
            - id: audit-service
              uri: ${novaforge.upstreams.audit-service:http://localhost:8085}
              predicates:
                - Path=/api/v1/audit/**
            - id: workflow
              uri: ${novaforge.upstreams.workflow-service:http://localhost:8086}
              predicates:
                - Path=/api/v1/workflow/**
            - id: notifications
              uri: ${novaforge.upstreams.notification-service:http://localhost:8088}
              predicates:
                - Path=/api/v1/notifications/**
            - id: reporting
              # PHASE-5 §2/§8: the report run/export surface (user+ at the service;
              # object-level report:execute decides per run). The /api/v1/dashboards
              # prefix stays reserved but unrouted in v1 (§2).
              uri: ${novaforge.upstreams.reporting-service:http://localhost:8089}
              predicates:
                - Path=/api/v1/reports/**
            - id: scheduler
              uri: ${novaforge.upstreams.scheduler-service:http://localhost:8087}
              predicates:
                - Path=/api/v1/scheduler/jobs
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${novaforge.auth.issuer-uri:http://localhost:8082/realms/novaforge}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    tracing:
      # Tempo direct-to (PHASE-3 §9, §13 Q4 — no collector in between).
      sampler: ${NOVAFORGE_TRACE_SAMPLER:always_on}
      export:
        otlp:
          endpoint: ${NOVAFORGE_TEMPO_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  file:
    # Promtail tails this shared dir into Loki (PHASE-3 §9).
    name: ${NOVAFORGE_LOG_DIR:/tmp/novaforge/logs}/${spring.application.name}.log
  pattern:
    # W3C trace context in every line — the shared-trace-id acceptance check (PHASE-0 §8)
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

novaforge:
  auth:
    # JWT validation reads the issuer through the same bridge every service uses —
    # without this entry NOVAFORGE_AUTH_ISSUER never reaches the gateway.
    issuer-uri: ${NOVAFORGE_AUTH_ISSUER:http://localhost:8082/realms/novaforge}
  upstreams:
    metadata-service: http://localhost:8081
