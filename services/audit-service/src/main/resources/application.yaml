spring:
  application:
    name: novaforge-audit-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${novaforge.auth.issuer-uri:http://localhost:8082/realms/novaforge}
  datasource:
    url: jdbc:postgresql://${NOVAFORGE_POSTGRES_HOST:localhost}:${NOVAFORGE_POSTGRES_PORT:5432}/novaforge_audit
    username: novaforge
    password: novaforge
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${NOVAFORGE_KAFKA:localhost:9092}
    consumer:
      group-id: novaforge-audit
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
