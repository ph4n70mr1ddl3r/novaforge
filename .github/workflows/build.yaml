name: build

# Actions are SHA-pinned (twenty-third pass): a major-version tag is a moving
# target, and a compromised or breaking tag update rewrites this pipeline in
# place — the pin is the commit each tag named when this file landed (the
# trailing comment keeps the intended major version readable).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Full verify incl. the Testcontainers suites (GitHub runners ship Docker;
    # Postgres/Redis containers start per JVM via test-support).
    runs-on: ubuntu-latest
    # a hung Testcontainers run must fail the job, not burn GitHub's 360-minute
    # default (this repo's own history includes surefire hangs — they happen)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The build-tree gate (2026-09-03 review): a stale Flyway migration left
      # in target/classes by a pre-rename incremental build made `verify` fail on
      # a tree whose sources were clean (41 workflow tests, "more than one
      # migration with version 5"). Sub-second here vs. 20 minutes of
      # Testcontainers to discover the same thing.
      - name: Build-tree gate (no stale compiled resources, migration versions unique)
        run: bash deploy/scripts/check-build-tree.sh

      - name: Set up Temurin 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify
        run: ./mvnw -B -ntp verify

      - name: Keycloak auth listener (deploy/keycloak — PHASE-3 §5)
        run: ./mvnw -B -ntp -f deploy/keycloak/auth-listener/pom.xml verify

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    # The pnpm workspace (PHASE-2 §2): shared (page model, expr/v1 TS twin, catalog,
    # resolver, renderer) + runtime-ui + builder-ui — strict tsc + the vitest suites
    # incl. the shared conformance corpus and the catalog gallery's axe checks.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Type-check and test
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test

  charts:
    # The chart-render gate (nineteenth pass): H-12P1 found 22 invalid templates
    # that had never rendered — fixed by hand then, but nothing in CI stopped the
    # identical regression class from returning. Every chart lints and renders
    # on every PR now.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a
        with:
          version: "3.16.4"

      # The full chart gate (twenty-first pass): lint + render every chart, keep
      # the infra chart's embedded files byte-honest against their compose-stack
      # sources, and verify DNS consistency across the render — every
      # env-referenced host must be a Service the same render creates (the check
      # that would have caught the release-prefixed-service-name defect).
      - name: Chart gate (lint, render, drift, DNS consistency)
        run: deploy/helm/check-charts.sh

      # The observability gate (forty-first pass): PHASE-0 §8's "one row per
      # service" Grafana baseline, enforced — the Integration and File services
      # were scraped for three phases without a dashboard row, and the Data
      # Runtime row rendered on top of the Metadata row since Phase 1 (the grid
      # is absolute). A service added without its row now fails CI.
      - name: Observability gate (row per service, grid honesty)
        run: bash deploy/scripts/check-observability.sh

  ops-scripts:
    # The deployment shell scripts' own regression suite (twenty-ninth pass):
    # the backup sidecar's inverted base-freshness predicate and the launchers'
    # unconditional "started pid N" lines were found by hand — the scripts had
    # zero automated coverage. ops-selftest.sh exercises the real scripts with
    # stubbed executables (no JVM, no containers, ~15 s).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Temurin 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Ops-script selftest (backup predicate, launcher honesty, log shipping)
        run: bash deploy/scripts/ops-selftest.sh

  clamav-on:
    # PHASE-6 §13 Q2 (resolved): one config-on job so the ClamAV scanning path stays
    # tested — the file-service suite runs with the gate on (the in-JVM clamd stand-in
    # speaks the INSTREAM contract; the EICAR sample quarantines exactly like a live
    # detection, §11 item 5).
    runs-on: ubuntu-latest
    # a hung Testcontainers run must fail the job, not burn GitHub's 360-minute
    # default (this repo's own history includes surefire hangs — they happen)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Temurin 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: File Service with the ClamAV gate on
        run: ./mvnw -B -ntp -pl services/file-service -am verify -Dnovaforge.file.clamav.enabled=true

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: surefire-reports-clamav
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore
          retention-days: 7

  images:
    # The image-publish leg (twenty-third pass, closing the mutable-tag deferral):
    # every push to main builds all eleven service images to GHCR under the
    # IMMUTABLE commit SHA — the tag pattern the charts' values comments name
    # (`helm upgrade --set image.tag=<sha>`); 0.1.0-SNAPSHOT remains the local
    # dev default only. PRs skip this: the build job already verified them, and
    # pull-request runs carry no registry credentials by design.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, frontend, charts, clamav-on]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Set up Temurin 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and push SHA-tagged images (jib)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          sha="${GITHUB_SHA}"
          # module -> image (the data-runtime artifact lives under api/)
          pairs="services/gateway ghcr.io/novaforge/novaforge-gateway
          services/metadata-service ghcr.io/novaforge/novaforge-metadata-service
          services/data-runtime/api ghcr.io/novaforge/novaforge-data-runtime
          services/audit-service ghcr.io/novaforge/novaforge-audit-service
          services/script-engine ghcr.io/novaforge/novaforge-script-engine
          services/workflow-service ghcr.io/novaforge/novaforge-workflow-service
          services/scheduler-service ghcr.io/novaforge/novaforge-scheduler-service
          services/notification-service ghcr.io/novaforge/novaforge-notification-service
          services/reporting-service ghcr.io/novaforge/novaforge-reporting-service
          services/integration-service ghcr.io/novaforge/novaforge-integration-service
          services/file-service ghcr.io/novaforge/novaforge-file-service"
          mods=$(echo "$pairs" | awk '{printf "%s%s", sep, $1; sep=","}')
          # one reactor pass INSTALLS every module's artifact into the local
          # repo; jib is goal-invoked per module after (no execution binding by
          # design). install, not package: each per-module jib invocation runs
          # in a single-module reactor (-pl "$mod"), so its internal
          # 0.1.0-SNAPSHOT dependencies can only resolve from ~/.m2 — package
          # never writes there and the second iteration failed dependency
          # resolution after having already pushed the first image.
          ./mvnw -B -ntp -pl "$mods" -am -DskipTests install
          # here-string, NOT a pipe: a piped while runs in a subshell whose
          # status is only the last iteration's — a failed middle image would
          # vanish. The here-string keeps the loop in this shell, where set -e
          # governs every jib invocation.
          while read -r mod image; do
            [ -z "$mod" ] && continue
            echo "::group::jib $image:$sha"
            ./mvnw -B -ntp -pl "$mod" jib:build \
              -Djib.to.image="$image:$sha" \
              -Djib.to.auth.username="$GHCR_USER" \
              -Djib.to.auth.password="$GHCR_TOKEN"
            echo "::endgroup::"
          done <<< "$pairs"

  integration-podman:
    # The PHASE-1 §8 Podman-socket runner (quay.io/podman/stable labels): the same
    # suites against rootless Podman — TESTCONTAINERS_* wiring documented in the README.
    runs-on: [self-hosted, podman]
    needs: [build, frontend, clamav-on]
    # a self-hosted runner that loses its socket must fail fast, not hang for
    # GitHub's 360-minute default on runner-hours
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Temurin 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify against the Podman socket
        env:
          DOCKER_HOST: unix:///run/podman/podman.sock
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /run/podman/podman.sock
        run: ./mvnw -B -ntp verify

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: surefire-reports-podman
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore
          retention-days: 7
